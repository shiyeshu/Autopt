# tasks.yaml 修正版
# 说明: 提示词不再显式指名工具（工具已通过 bind_tools 提供给模型），
# 改为描述意图与约束，让模型自主选择合适的工具，提示词更自由优美。
# 输出格式约定: strategy/deputy/operator/auditor 的输出直接展示在终端，
# 使用 Markdown 渲染，但**禁止使用标题**(#/##/###)，标题会改变字号；
# 一律用正文文字，可用加粗/列表等但不要用标题级别。

strategy_task:
  description: >
    当前目标: {target}
    历史战况摘要: {mission_history}
    
    1. 分析当前渗透阶段。基于提供的 mission.log 最新正文与历史战况摘要做判断。
    2. 如果是第一轮任务或日志为空，直接制定初始战术，交给副指挥官执行。
    3. 制定下一步的单一战术（Next Step），严禁制定宏大计划。
    4. 尽量扩大战果，若存在可能有风险的路径优先尝试。
    5. 可读取日志文件获取更完整信息，但避免冗余读取。
  expected_output: >
    简短的战术意图描述。使用正文文字，禁止使用 Markdown 标题（#、##），标题会改变字号。

deputy_task:
  description: >
    接收战略意图（上下文会自动提供），将其转化为技术需求。
    确保你的输出能指导 Operator 去搜索/选择特定类型的工具或系统命令。
  expected_output: >
    单一的技术任务需求。使用正文文字，禁止使用 Markdown 标题（#、##）。

operator_task:
  description: >
    接收 Deputy 的需求。

    **执行步骤**：
    1. 分析是否可以使用系统自带的命令行工具（如 curl、ping、wget 等）满足需求。如果可以，直接生成命令。
    2. 如果系统命令无法满足，则查看工具目录（./aptools/）了解可用工具；查看根目录获取工具文件夹列表，从中选择合适工具；每次查看一个目录，subdir 参数为子目录名称（查看根目录时留空）。
    3. 获取所选工具的绝对路径。
    4. 使用【绝对路径】和目标 IP {target} 构造命令，确保无 <target> 占位符残留。
  expected_output: >
    一条包含绝对路径、无占位符的可执行命令字符串。以纯文本输出，不要使用 Markdown 代码块或标题。不得输出空内容，如果为空则输出"无命令"。如果没有生成命令行，则重新尝试生成，直到生成命令行。

auditor_task:
  description: >
    接收上一步 Operator 生成的命令。如果没有命令，输出“无正确命令”并结束任务。

    **执行流程 (必须严格遵守)**:
    1. 
       - 检查命令是否存在 `rm -rf`、'删除系统文件' 等高危操作，如果有则拒绝执行。
       - 检查命令是否调用了动态刷新的命令行工具，如果是请使用静默输出参数。比如dirsearch可以添加 “-q --no-color” 来关闭颜色和进度条。
       - 检查命令如果是系统自带的工具，通过命令执行方式运行（如 cmd /c ping <target> 或 bash -c "ping <target>"）；如果是其他工具，必须使用绝对路径执行。
       - 禁止使用可能消耗长时间的命令,比如 nmap 全端口扫描时未添加优化参数。
       - 禁止生成交互式命令，比如ssh登录等需要人工交互的命令。尽量使用无交互的命令或者添加参数实现非交互式，一次性执行命令。
       - **关键步骤**: 检查通过后，你必须实际运行该命令（通过命令执行能力），而不是只描述它。
    2. 获取命令的 stdout 和 stderr 作为真实输出。

    【注意事项】:
    1. 你必须在代码层面真正执行命令，禁止只输出命令文本。
    2. 你**禁止**预测命令的输出结果，只能返回实际执行的真实输出。
    3. 如果执行报错，你就报告报错信息。
    4. 如果命令没有输出，你就报告“无输出”。

    **警告**: 
    - 不要试图模拟命令运行结果！
    - 你的回答必须是命令执行的真实输出。
    - 禁止输出大于1000字的内容，如果输出过长，请截取前1000字并注明“输出过长，已截断”。
  expected_output: >
    命令实际执行并返回真实输出。以纯文本返回，禁止使用 Markdown 标题（#、##）。如果没有执行则视为失败。


reporting_task:
  description: >
    **处理完整日志文件**：

    1. 读取 "mission.log"（日志内容可自动获取，也可读取文件获取完整内容）。
    2. **日志已完整返回**（包含所有 CMD、STDOUT），从中提取：
       - 执行轮次数量
       - 每个轮次的命令和关键输出
       - nmap/dirsearch 等扫描的具体发现（端口列表、服务版本）
    
    3. 生成 Markdown 报告：
       ```
       # 渗透测试汇总
       
       ## 目标
       10.0.86.178
       
       ## 扫描发现
       | 端口 | 服务 | 状态 |
       | 25/tcp | smtp | filtered |
       | 53/tcp | domain | open |
       | 135/tcp | msrpc | open |
       ...
       
       ## 执行记录
       - 轮次1: nmap 全端口扫描 (80s)
       - 轮次2: fscan Web 服务探测 (5s)
       ...
       ```
    
    4. 将 Markdown 报告写入 "final_report.md" 文件。
    
    **注意**：
    - mission.log 包含完整 STDOUT，不要说“前500字符”。
    - 优先提取 nmap 的 PORT/STATE/SERVICE 表格。
    
  expected_output: >
    Markdown 报告写入成功。




html_reporting_task:
  description: >
    **基于数据表撰写专业报告**：

    1. 读取 "final_report.md"（内容可自动获取，也可读取文件）。
    
    2. 将表格数据转化为**流畅的叙述**：
       - **Executive Summary**：总结目标、轮次数、主要发现。
       - **Methodology**：描述执行的扫描工具和技术。
       - **Findings**：将表格数据转化为段落，例如：
         "本次测试共执行 3 轮扫描，发现目标主机开放 SSH(22)、HTTP(80) 服务。"
       - **Recommendations**：基于发现给出建议。
    
    3. 嵌入指定的 CSS，生成 "final_report.html" 文件。
    
    **约束**：
    - 所有数据必须来自 MD 表格。
    - 不要引用原始日志，直接用汇总数据。
    - 日志中捕获的目标 HTML/JS 内容（如 <script>、<img onerror> 等 XSS payload）必须转义为纯文本展示，严禁原样嵌入可执行标签。
    
  expected_output: >
    HTML 报告写入成功。
